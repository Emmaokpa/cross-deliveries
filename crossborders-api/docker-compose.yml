# ---------------------------------------------------------------------------
# CrossBordersDeliveries — PocketBase (database) + Express API
#
# Deploy this single compose file in Coolify ("New Resource" → "Compose").
# Both services share an internal network, so the API reaches PocketBase at
# http://pocketbase:8090 without exposing the database publicly.
#
# Set these as Environment Variables on the compose service in Coolify:
#   JWT_SECRET                 long random string
#   POCKETBASE_ADMIN_EMAIL      superuser email (created automatically below)
#   POCKETBASE_ADMIN_PASSWORD   superuser password
#   CORS_ORIGINS                your frontend origin(s), comma-separated
#   APP_DOMAIN                  public URL of the frontend
#   Email (Hostinger SMTP): SMTP_HOST=smtp.hostinger.com, SMTP_PORT=465,
#     SMTP_USER=<full Hostinger email>, SMTP_PASS=<mailbox password>,
#     MAIL_FROM=<full Hostinger email>. Leave BREVO_API_KEY blank.
#   Inbound replies (IMAP): IMAP_HOST=imap.hostinger.com, IMAP_PORT=993,
#     IMAP_USER=<same mailbox>, IMAP_PASS=<same password>.
# ---------------------------------------------------------------------------

services:
  pocketbase:
    image: pocketbase/pocketbase:latest
    restart: unless-stopped
    # NOTE: the old `--superuser` flag was removed in recent PocketBase
    # versions (it crashes the container). Create the superuser ONCE after the
    # first boot instead:
    #   docker exec -it <pocketbase-container> ./pocketbase superuser upsert <email> <password>
    # and keep the same values in POCKETBASE_ADMIN_EMAIL / POCKETBASE_ADMIN_PASSWORD.
    command: ./pocketbase serve --http=0.0.0.0:8090
    environment:
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:?set in Coolify}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:?set in Coolify}
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No public ports — the API talks to it over the internal network.
    # To reach the PocketBase admin UI, temporarily add:
    #   ports: ["8090:8090"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8787"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:?set in Coolify}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:?set in Coolify}
      JWT_SECRET: ${JWT_SECRET:?set in Coolify}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Email — any SMTP provider (Hostinger: smtp.hostinger.com:465)
      BREVO_API_KEY: ${BREVO_API_KEY:-} # leave blank unless using Brevo's HTTP API
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Inbound replies (IMAP, same Hostinger mailbox) — shown in Admin → Mail
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_POLL_MINUTES: ${IMAP_POLL_MINUTES:-5}
    # Coolify routes traffic to the container on PORT (8787).
    expose:
      - "8787"

volumes:
  pocketbase_data:
