<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track — CBD-CURRENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --color-primary:#e30613;
      --color-primary-dark:#b80510;
      --color-navy:#031435;
      --color-line:#e5e7eb;
      --color-muted:#717171;
      --font-heading:"Oswald","Arial Narrow",sans-serif;
      --font-body:"Poppins","Helvetica Neue",sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family:var(--font-body);
      color:var(--color-muted);
      background:#fff;
      font-size:1rem;
      line-height:1.7;
      overflow-x:hidden;
    }
    h4{
      font-family:var(--font-heading);
      font-weight:700;
      color:#000;
      line-height:1.3;
      margin:0;
    }
    .text-h4{ font-size:clamp(1.0625rem,1rem + 0.3vw,1.25rem); }
    .text-navy{ color:var(--color-navy); }
    .text-primary{ color:var(--color-primary); }
    .text-neutral-700{ color:#374151; }
    .text-muted{ color:var(--color-muted); }
    .font-bold{ font-weight:700; }
    .font-semibold{ font-weight:600; }
    .font-normal{ font-weight:400; }
    .font-heading{ font-family:var(--font-heading); }
    .text-center{ text-align:center; }
    .text-left{ text-align:left; }
    .text-right{ text-align:right; }
    .border-t-2{ border-top-width:2px; }
    .border-primary{ border-color:var(--color-primary); }
    .border-[#E5E7EB]{ border-color:#E5E7EB; }
    .border-2{ border-width:2px; }
    .border-[#0E7A3D]{ border-color:#0E7A3D; }
    .border-[#0E6B39]{ border-color:#0E6B39; }
    .pt-4{ padding-top:1rem; }
    .mt-2\\.5{ margin-top:0.625rem; }
    .mt-3{ margin-top:0.75rem; }
    .mt-4{ margin-top:1rem; }
    .mt-5{ margin-top:1.25rem; }
    .mt-7{ margin-top:1.75rem; }
    .mt-8{ margin-top:2rem; }
    .mx-auto{ margin-left:auto; margin-right:auto; }
    .w-4\\/5{ width:80%; }
    .max-w-sm{ max-width:24rem; }
    .h-px{ height:1px; }
    .bg-\\[\\#E5E7EB\\]{ background-color:#E5E7EB; }
    .bg-\\[\\#F2F7F3\\]{ background-color:#f2f7f3; }
    .bg-\\[\\#E9F6EE\\]{ background-color:#E9F6EE; }
    .bg-\\[\\#F8F9FB\\]{ background-color:#F8F9FB; }
    .bg-white{ background-color:#fff; }
    .rounded-full{ border-radius:9999px; }
    .rounded-sm{ border-radius:0.125rem; }
    .px-2{ padding-left:0.5rem; padding-right:0.5rem; }
    .px-3{ padding-left:0.75rem; padding-right:0.75rem; }
    .px-4{ padding-left:1rem; padding-right:1rem; }
    .py-0\\.5{ padding-top:0.125rem; padding-bottom:0.125rem; }
    .py-2{ padding-top:0.5rem; padding-bottom:0.5rem; }
    .py-3{ padding-top:0.75rem; padding-bottom:0.75rem; }
    .py-2\\.5{ padding-top:0.625rem; padding-bottom:0.625rem; }
    .text-xs{ font-size:0.75rem; }
    .text-sm{ font-size:0.875rem; }
    .text-base{ font-size:1rem; }
    .text-\\[13px\\]{ font-size:13px; }
    .text-\\[13\\.5px\\]{ font-size:13.5px; }
    .text-\\[14px\\]{ font-size:14px; }
    .text-\\[13\\.5px\\]{ font-size:13.5px; }
    .text-lg{ font-size:1.125rem; }
    .inline-block{ display:inline-block; }
    .min-w-0{ min-width:0; }
    .break-words{ word-break:break-word; }
    .font-semibold{ font-weight:600; }
    .whitespace-nowrap{ white-space:nowrap; }
    .shadow-\\[0_16px_40px_rgba\\(3\\,20\\,53\\,0\\.16\\)\\]{ box-shadow:0 16px 40px rgba(3,20,53,0.16); }
    .shadow-sm{ box-shadow:0 1px 2px 0 rgba(0,0,0,0.05); }
    .overflow-hidden{ overflow:hidden; }
    .space-y-4 > * + *{ margin-top:1rem; }
    .mt-5\\.5{ margin-top:1.375rem; }
    .mb-0{ margin-bottom:0; }
    strong{ font-weight:700; }
    .flex{ display:flex; }
    .flex-wrap{ flex-wrap:wrap; }
    .justify-center{ justify-content:center; }
    .gap-x-6{ column-gap:1.5rem; }
    .gap-x-8{ column-gap:2rem; }
    .gap-y-5{ row-gap:1.25rem; }
    .items-center{ align-items:center; }
    .justify-between{ justify-content:space-between; }
    .gap-3{ gap:0.75rem; }
    .shrink-0{ flex-shrink:0; }
    .border-t-2{ border-top-width:2px; }
    .border-t{ border-top-width:1px; }
    .border-t\\.5{ border-top-width:0.5px; }
    .w-full{ width:100%; }
    .max-w-\\[\\]{ max-width:none; }
    .rounded-sm{ border-radius:0.125rem; }
    .border{ border-width:1px; }
    .border-[#E5E7EB]{ border-color:#E5E7EB; }
    .bg-[#F3F4F6]{ background-color:#F3F4F6; }
    .border-r{ border-right-width:1px; }
    .max-sm\:border-r{ border-right-width:0; }
    @media (max-width:640px){
      .max-sm\:border-r{ border-right-width:1px; }
      .sm\:flex-col{ flex-direction:column; }
      .sm\:grid-cols-2{ grid-template-columns:1fr 1fr; }
      .sm\:flex-row{ flex-direction:row; }
      .sm\:flex-col{ flex-direction:column; }
    }
    /* Section 1 field grid — mirrors TrackForm.jsx:
       1-col → 2-col (sm) → 3-col (md) → 5-col (lg+), evenly spaced. */
    @media (min-width:640px){
      .sm\:gap-x-8{ column-gap:2rem; }
      .sm\:w-\[calc\(50%_-_1rem\)\]{ width:calc(50% - 1rem); }
    }
    @media (min-width:768px){
      .md\:w-\[calc\(33.333%_-_1.333rem\)\]{ width:calc(33.333% - 1.333rem); }
    }
    @media (min-width:1024px){
      .lg\:w-\[calc\(20%_-_1.6rem\)\]{ width:calc(20% - 1.6rem); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    // Minimal React-like rendering just for the visual snapshot below.
    // Mirrors the spec layout so you can eyeball spacing/alignment with no build.
    const root = document.getElementById('root')

    const MOCK = {
      tracking_number: 'CBD-2026-54821',
      current_status: 'Enroute',
      origin_city: 'Netherlands',
      destination_city: 'United States',
      cargo_type: 'Air',
      package_description: 'Sealed Metal Box',
      package_weight: 15,
      package_quantity: 1,
      estimated_delivery: '2026-07-04T00:00:00Z',
      delivered_at: null,
      checkpoints: [
        {
          timestamp: '2026-06-27 02:51:00.000Z',
          location: 'Dubai UAE',
          status_tag: 'On Hold',
          admin_notes: 'Your package is on hold',
          updated_by: 'Altan Baris',
        },
        {
          timestamp: '2026-06-25 14:12:00.000Z',
          location: 'Istanbul, Turkiye',
          status_tag: 'In Transit',
          admin_notes: 'Departed origin facility',
          updated_by: 'Cross Borders Operations',
        },
        {
          timestamp: '2026-06-24 09:05:00.000Z',
          location: 'Amsterdam, Netherlands',
          status_tag: 'Created',
          admin_notes: 'Consignment created in system',
          updated_by: 'Cross Borders Operations',
        },
      ],
    }

    function parseDate(value){
      if(value instanceof Date) return value
      if(typeof value === 'number') return new Date(value)
      const s = String(value ?? '').trim()
      if(!s) return new Date(NaN)
      if(/^\d{4}-\d{2}-\d{2}[ T]/.test(s)){
        let t = s.replace(' ','T')
        if(!/[Z|[+-]\d{2}:?\d{2})$/.test(t)) t += 'Z'
        return new Date(t)
      }
      return new Date(s)
    }

    function isoDate(value){
      const d = parseDate(value)
      if(Number.isNaN(d.getTime())) return '—'
      const m = String(d.getMonth()+1).padStart(2,'0')
      const day = String(d.getDate()).padStart(2,'0')
      return `${d.getFullYear()}-${m}-${day}`
    }

    function clockTime(value){
      const d = parseDate(value)
      if(Number.isNaN(d.getTime())) return '—'
      let h = d.getHours()
      const ampm = h >= 12 ? 'pm' : 'am'
      h = h % 12 || 12
      return `${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${ampm}`
    }

    function SectionTitle({children}){
      const wrap = document.createElement('div')
      wrap.className = 'text-center'
      const h = document.createElement('h4')
      h.className = 'font-heading text-h4 font-bold text-navy'
      h.textContent = children
      const div = document.createElement('div')
      div.className = 'mx-auto mt-2 h-px w-4/5 max-w-sm bg-[#E5E7EB]'
      wrap.appendChild(h)
      wrap.appendChild(div)
      return wrap
    }

    function el(tag, className, children){
      const n = document.createElement(tag)
      if(className) n.className = className
      if(children != null) n.textContent = children
      return n
    }

    function mapOrDash(value, fallback='—'){
      return value !== undefined && value !== null && value !== '' ? value : fallback
    }

    function TrackingResult({result}){
      if(!result) return el('div',null)

      const infoFields = [
        ['Origin', mapOrDash(result.origin_city)],
        ['Package', mapOrDash(result.package_description)],
        ['Status', mapOrDash(result.current_status)],
        ['Destination', mapOrDash(result.destination_city)],
        ['Carrier', 'CrossBordersDeliveries'],
        ['Type of Shipment', result.cargo_type ? `${result.cargo_type} Freight` : '—'],
        ['Weight', (result.package_weight == null || Number(result.package_weight) <= 0) ? '—' : `${result.package_weight}kg`],
        ['Shipment Mode', result.cargo_type ? `${result.cargo_type} Freight` : '—'],
        ['Carrier Reference No.', mapOrDash(result.tracking_number)],
        ['Product', mapOrDash(result.package_description)],
        ['Qty', String(result.package_quantity ?? 1)],
      ]

      const historyEntries = (result.checkpoints || []).map(cp => [
        ['Date', isoDate(cp.timestamp)],
        ['Time', clockTime(cp.timestamp)],
        ['Location', mapOrDash(cp.location)],
        ['Status', cp.status_tag || '—'],
        ['Updated By', mapOrDash(cp.updated_by,'—')],
        ['Remarks', mapOrDash(cp.admin_notes)],
      ])

      const section = document.createElement('div')
      section.className = 'mt-5 border-t-2 border-primary pt-4 text-left'

      const header = document.createElement('div')
      header.className = 'flex flex-wrap items-center justify-between gap-3'
      header.appendChild(el('h4','font-body text-h4 font-normal', result.tracking_number))

      const live = document.createElement('span')
      live.className = 'rounded-full bg-primary px-3 py-0.5 text-sm font-semibold text-white whitespace-nowrap'
      live.textContent = result.current_status
      header.appendChild(live)
      section.appendChild(header)

      if(result.current_status === 'Delivered'){
        const stamp = document.createElement('div')
        stamp.className = 'mt-4 rounded-sm border-2 border-[#0E7A3D] bg-[#E9F6EE] px-4 py-3 text-center'
        const p1 = document.createElement('p')
        p1.className = 'font-heading text-lg font-bold text-[#0E6B39]'
        p1.textContent = '✓ DELIVERED'
        stamp.appendChild(p1)
        if(result.delivered_at){
          const p2 = document.createElement('p')
          p2.className = 'text-[13px] text-[#2F6B4C]'
          p2.textContent = new Date(result.delivered_at).toLocaleDateString()
          stamp.appendChild(p2)
        }
        section.appendChild(stamp)
      } else if(result.estimated_delivery){
        const eta = document.createElement('p')
        eta.className = 'mt-3 rounded-sm bg-[#f2f7f3] px-3 py-2 text-[13.5px] text-[#0E6B39]'
        eta.innerHTML = `Estimated delivery: <strong>${new Date(result.estimated_delivery).toLocaleDateString()}</strong>`
        section.appendChild(eta)
      }

      // Section 1
      const s1 = document.createElement('section')
      s1.className = 'mt-7'
      s1.appendChild(SectionTitle('Shipment Information'))
      const grid = document.createElement('div')
      grid.className = 'mt-5 flex flex-wrap justify-center gap-x-6 gap-y-5 text-center sm:gap-x-8'
      infoFields.forEach(([label,value]) => {
        const block = document.createElement('div')
        block.className = 'w-full min-w-0 sm:w-[calc(50%_-_1rem)] md:w-[calc(33.333%_-_1.333rem)] lg:w-[calc(20%_-_1.6rem)]'
        const dt = document.createElement('dt')
        dt.className = 'text-[13px] font-bold text-navy'
        dt.textContent = `${label}:`
        const dd = document.createElement('dd')
        dd.className = 'mt-1 break-words text-[14px] font-normal text-neutral-700'
        dd.textContent = value
        block.appendChild(dt)
        block.appendChild(dd)
        grid.appendChild(block)
      })
      s1.appendChild(grid)
      section.appendChild(s1)

      // Section 2
      const s2 = document.createElement('section')
      s2.className = 'mt-8'
      s2.appendChild(SectionTitle('Shipment History'))
      if(historyEntries.length > 0){
        const wrap = document.createElement('div')
        wrap.className = 'mt-4 space-y-4'
        historyEntries.forEach((rows,i) => {
          const card = document.createElement('div')
          card.className = 'overflow-hidden rounded-sm border border-[#E5E7EB] bg-white shadow-sm'
          rows.forEach(([label,value],j) => {
            const row = document.createElement('div')
            row.className = `flex items-start justify-between gap-4 px-4 py-2.5 ${j>0?'border-t border-[#E5E7EB]':''}`
            const lbl = document.createElement('span')
            lbl.className = 'text-[13.5px] font-bold text-navy'
            lbl.textContent = `${label}:`
            const val = document.createElement('span')
            val.className = 'min-w-0 break-words text-right text-[13.5px] text-neutral-700'
            if(label === 'Status'){
              const badge = document.createElement('span')
              badge.className = 'inline-block rounded-full bg-[#fdeaec] px-2 py-0.5 text-xs font-semibold text-primary'
              badge.textContent = value
              val.appendChild(badge)
            } else {
              val.textContent = value
            }
            row.appendChild(lbl)
            row.appendChild(val)
            card.appendChild(row)
          })
          const keyed = document.createElement('div')
          keyed.appendChild(card)
          wrap.appendChild(keyed)
        })
        s2.appendChild(wrap)
      } else {
        const empty = document.createElement('p')
        empty.className = 'mt-4 rounded-sm bg-[#F8F9FB] px-4 py-3 text-center text-sm text-muted'
        empty.textContent = 'No shipment updates recorded yet — check back soon.'
        s2.appendChild(empty)
      }
      section.appendChild(s2)

      return section
    }

    const page = document.createElement('div')
    page.className = 'mx-auto w-full max-w-3xl rounded-md border border-[#E5E7EB] bg-[#F3F4F6] p-5 shadow-[0_16px_40px_rgba(3,20,53,0.16)] sm:p-6 md:p-8'
    page.appendChild(TrackingResult({result:MOCK}))
    root.appendChild(page)
  </script>
</body>
</html>
